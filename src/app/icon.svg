<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
<title>DailySpoon</title>
<!--
  Icône de l'application (favicon, PWA, écran d'accueil).

  Fond TRANSPARENT : aucun rectangle de fond, l'icône se pose donc directement
  sur le fond d'écran ou la barre d'onglets.

  "DS" occupe le maximum de place en hauteur comme en largeur, dans la même
  police que le thème Material (Inter). Note importante : cette pile de
  polices n'est PAS chargée depuis l'application — un SVG d'icône est rendu
  isolément, sans le CSS du site, donc sans le @font-face de Google Fonts.
  Sur une machine sans Inter installée, le rendu retombe sur la grotesque
  système (Segoe UI, Roboto, Helvetica…), très proche pour deux lettres. Les
  PNG de public/icons, eux, sont rendus une fois pour toutes et ne dépendent
  d'aucune police installée.

  La cuillère passe PAR-DESSUS les lettres, en rouge profond (#8a0303) — le
  même rouge d'encre que les tampons-dates posés sur les photos, volontairement
  identique dans toutes les déclinaisons du thème.
-->
<text
  x="256"
  y="256"
  text-anchor="middle"
  dominant-baseline="central"
  font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
  font-weight="800"
  font-size="330"
  letter-spacing="-12"
  fill="#e2e2e2"
>DS</text>
<g transform="rotate(25 256 256)">
  <ellipse cx="256" cy="170" rx="68" ry="112" fill="#8a0303"/>
  <rect x="231" y="260" width="50" height="194" rx="25" fill="#8a0303"/>
</g>
</svg>
